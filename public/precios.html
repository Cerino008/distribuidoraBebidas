<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
  content="img-src * data:; default-src 'self' https: http: data: blob:;">


  <title>Catálogo - Distribuidora</title>
  <link rel="stylesheet" href="precios.css">
  <!-- librerías para generar PDF -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="precios.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="brand">
        <h1>Distribuidora — Catálogo</h1>
        <p class="subtitle">Lista actualizada desde Google Sheets</p>
      </div>

      <div class="actions">
        <div id="fechaActualizacion" class="fecha">Última actualización: —</div>
        <div class="btns">
          <button id="btnRefrescar" class="btn">Refrescar</button>
          <button id="btnDescargar" class="btn primary">Descargar PDF</button>
        </div>
      </div>
    </header>

    <main>
      <div id="tablaWrapper" class="tabla-wrapper">
        <table id="tablaCatalogo" class="catalogo">
          <thead>
            <tr>
              <th class="col-prod">Producto</th>
              <th class="col-foto">Foto</th>
              <th class="col-desc">Descripción</th>
              <th class="col-cat">Categoría</th>
              <th class="col-precio">Precio x pack</th>
            </tr>
          </thead>
          <tbody>
            <!-- se completa vía JS -->
          </tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      <small>© Distribuidora — Lista generada desde Google Sheets</small>
      <!-- Referencia local (si querés usar tu PDF original) -->
      <!-- Archivo original subido: /mnt/data/Caja pequeña (1).pdf -->
      <!-- Si lo querés enlazar web, movelo a public/ y usa: <a href="/Caja_pequena.pdf" target="_blank">PDF original</a> -->
    </footer>
  </div>
</body>
</html>
