<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica del documento -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Política de Seguridad de Contenido (CSP) -->
  <!-- Permite recursos seguros y controla qué fuentes se pueden cargar -->
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self' https: http: data: blob:;
      img-src * data:;
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      style-src-attr 'unsafe-inline';
    ">

  <title>Catálogo - Distribuidora</title>
  
  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="precios.css">

  <!-- Librerías externas para generación de PDF -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- Script principal de la aplicación (cargado de forma diferida) -->
  <script src="precios.js" defer></script>
</head>

<body>
  <!-- Contenedor principal -->
  <div class="wrap">
    
    <!-- Cabecera de la aplicación -->
    <header class="header">
      
      <!-- Sección de marca y título -->
      <div class="brand">
        <h1>Distribuidora — Catálogo</h1>
        <p class="subtitle">Lista actualizada desde Google Sheets</p>
      </div>

      <!-- Sección de acciones y controles -->
      <div class="actions">
        <!-- Muestra la fecha de última actualización -->
        <div id="fechaActualizacion" class="fecha">Última actualización: —</div>
        
        <!-- Botones de acción -->
        <div class="btns">
          <button id="btnRefrescar" class="btn">Refrescar</button>
          <button id="btnDescargar" class="btn primary">Descargar PDF</button>
        </div>
      </div>
      
    </header>

    <!-- Contenido principal -->
    <main>
      
      <!-- Contenedor de la tabla (se usa para generar el PDF) -->
      <div id="tablaWrapper" class="tabla-wrapper">
        
        <!-- Tabla principal del catálogo -->
        <table id="tablaCatalogo" class="catalogo">
          
          <!-- Encabezados de la tabla -->
          <thead>
            <tr>
              <th class="col-prod">Producto</th>
              <th class="col-foto">Foto</th>
              <th class="col-desc">Descripción</th>
              <th class="col-cat">Categoría</th>
              <th class="col-precio">Precio x pack</th>
            </tr>
          </thead>
          
          <!-- Cuerpo de la tabla (se completa dinámicamente con JavaScript) -->
          <tbody>
            <!-- Los productos se cargan aquí mediante JavaScript -->
          </tbody>
          
        </table>
      </div>
      
    </main>

    <!-- Pie de página -->
    <footer class="footer">
      <small>© Distribuidora — Lista generada desde Google Sheets</small>
      <!-- 
        Referencia para PDF original (comentado por ahora):
        <a href="/Caja_pequena.pdf" target="_blank">PDF original</a> 
      -->
    </footer>
    
  </div>
</body>
</html>
